name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential

      - name: Set up Android SDK paths
        run: |
          ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          ANDROID_CMDLINE_TOOLS="$HOME/.buildozer/android/platform/cmdline-tools"
          mkdir -p "$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_CMDLINE_TOOLS"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$PATH:$ANDROID_SDK_ROOT/tools:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_CMDLINE_TOOLS/latest/bin" >> "$GITHUB_ENV"

      - name: Install Android cmdline-tools
        run: |
          URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -Lo cmdline-tools.zip "$URL"
          unzip -q cmdline-tools.zip -d "$HOME/.buildozer/android/platform/"
          mv "$HOME/.buildozer/android/platform/cmdline-tools" "$HOME/.buildozer/android/platform/cmdline-tools-temp"
          mkdir -p "$HOME/.buildozer/android/platform/cmdline-tools"
          mv "$HOME/.buildozer/android/platform/cmdline-tools-temp/latest" "$HOME/.buildozer/android/platform/cmdline-tools/"

      - name: Accept Android SDK licenses
        run: |
          sdkmanager --licenses || true
          # Принудительно соглашаемся со всеми лицензиями
          yes | sdkmanager --licenses

      - name: Install required SDK components
        run: |
          # platform-tools и build-tools нужной версии
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Buildozer
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer cython==0.29.36
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gray-game-apk
          path: bin/*.apk

