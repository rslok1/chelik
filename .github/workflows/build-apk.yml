name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            python3-pip python3-venv \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential

      # ВАЖНО: Явно задаем JAVA_HOME, чтобы sdkmanager и Buildozer использовали Java 17
      - name: Set Java 17 environment
        run: |
          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "PATH=${JAVA_HOME}/bin:$PATH" >> "$GITHUB_ENV"

      - name: Verify Java version
        run: java -version

      - name: Set up Android SDK paths
        run: |
          ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          ANDROID_CMDLINE_TOOLS="$HOME/.buildozer/android/platform/cmdline-tools"
          mkdir -p "$ANDROID_SDK_ROOT"
          mkdir -p "$ANDROID_CMDLINE_TOOLS"
          
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          # Важно: путь должен вести в latest/bin
          echo "PATH=$PATH:$ANDROID_SDK_ROOT/tools:$ANDROID_SDK_ROOT/tools/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_CMDLINE_TOOLS/latest/bin" >> "$GITHUB_ENV"

      - name: Install Android cmdline-tools
        run: |
          URL="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          curl -Lo cmdline-tools.zip "$URL"
          unzip -q cmdline-tools.zip -d "$HOME/.buildozer/android/platform/"
          
          ANDROID_CMDLINE_TOOLS="$HOME/.buildozer/android/platform/cmdline-tools"

          if [ -d "$ANDROID_CMDLINE_TOOLS/cmdline-tools" ]; then
            mv "$ANDROID_CMDLINE_TOOLS/cmdline-tools" "$ANDROID_CMDLINE_TOOLS/latest"
          elif [ ! -d "$ANDROID_CMDLINE_TOOLS/latest" ]; then
            mkdir -p "$ANDROID_CMDLINE_TOOLS/latest"
            # Переносим всё содержимое (bin, NOTICE.txt и т.д.) в папку latest
            mv "$ANDROID_CMDLINE_TOOLS"/* "$ANDROID_CMDLINE_TOOLS/latest/" 2>/dev/null || true
          fi

      - name: Accept Android SDK licenses
        run: |
          sdkmanager --licenses --no_ui || true


      - name: Install required SDK components
        run: |
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34"

      - name: Install Buildozer and dependencies
        run: |
          python3 -m pip install --user --upgrade pip
          # Ставим конкретную версию cython, которая стабильна с текущими p4a
          python3 -m pip install --user buildozer cython==0.29.36
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build APK with Buildozer
        run: |
          # Отключаем интерактивный ввод (-n), чтобы сборка не зависла, ожидая ответа в CI
          buildozer -n android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gray-game-apk
          path: bin/*.apk
